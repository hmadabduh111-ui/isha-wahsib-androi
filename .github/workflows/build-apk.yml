name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o *.zip -d extracted

      - name: Find Android project
        run: |
          FILE=$(find extracted -name gradlew -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Awake-And-Calculate-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
